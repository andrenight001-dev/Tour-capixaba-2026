:root{
  --mar:#0A4E68;--fundo:#123441;--tinta:#16303A;--mut:#5D7178;
  --espuma:#EEF3F1;--areia:#F6EBD3;--sol:#F2B33D;--restinga:#2F7A57;--linha:#D9E3E0;
  --gua:#B8641A;--vv:#2F7A57;--vit:#3D4FA0;--out:#8A3D6B;
  --disp:'Bricolage',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--espuma);color:var(--tinta);font:16px/1.5 var(--body);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mar)}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* barra superior compacta */
.top{position:sticky;top:0;z-index:6;background:var(--mar);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top img{width:36px;height:36px;border-radius:50%;border:2px solid var(--sol);object-fit:cover}
.top h1{margin:0;font:800 19px/1.1 var(--disp);flex:1;letter-spacing:-.01em}
.iconbtn{border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;display:grid;place-items:center}

/* capa (somente na aba Hoje) */
.hero{position:relative;background:var(--mar);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 64px;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:46px;background:var(--espuma);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 46' preserveAspectRatio='none'><path d='M0 22 C60 4 110 4 170 20 S290 40 400 14 V46 H0Z'/></svg>") center/100% 100%;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 46' preserveAspectRatio='none'><path d='M0 22 C60 4 110 4 170 20 S290 40 400 14 V46 H0Z'/></svg>") center/100% 100%}
.hero .row{display:flex;align-items:center;gap:16px;max-width:720px;margin:0 auto}
.avatar{width:108px;height:108px;border-radius:50%;flex:none;border:4px solid var(--sol);box-shadow:0 0 0 6px rgba(242,179,61,.18);object-fit:cover;background:#0d3a4c}
.hero h2{margin:0;font:800 34px/1 var(--disp);letter-spacing:-.025em}
.hero .sub{margin:6px 0 0;font-size:15px;opacity:.88}
.hero .search-fab{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
.status{max-width:720px;margin:20px auto 0;display:flex;align-items:baseline;gap:12px}
.status b{font:800 56px/0.9 var(--disp);color:var(--sol);letter-spacing:-.03em}
.status span{font-size:16px;line-height:1.3}

main{max-width:720px;margin:0 auto;padding:6px 14px 20px}
h3.sec{font:800 21px/1.2 var(--disp);margin:24px 2px 10px;letter-spacing:-.01em}
.panel{background:#fff;border-radius:18px;padding:14px 16px;margin:0 0 12px;border:1px solid var(--linha)}
.panel.now{border:2px solid var(--sol);background:#FFFBF1}
.muted{color:var(--mut)}
.small{font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;vertical-align:middle}
.pill.gua{background:var(--gua)}.pill.vv{background:var(--vv)}.pill.vit{background:var(--vit)}.pill.out{background:var(--out)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--espuma);color:var(--tinta);margin:0 4px 4px 0}

/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:9px 13px;background:var(--mar);color:#fff;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--espuma);color:var(--mar)}
.btn.sol{background:var(--sol);color:var(--fundo)}
.btn.on{background:var(--restinga);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lnk{border:0;background:none;color:var(--mar);font-size:14px;font-weight:600;padding:4px 0;cursor:pointer;text-decoration:none}

/* atalhos */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 4px}
.quick a,.quick button{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:12px 4px 10px;text-align:center;text-decoration:none;color:var(--tinta);font-size:12.5px;cursor:pointer}
.quick i{display:block;font-style:normal;font-size:24px;line-height:1.2;margin-bottom:2px}

/* faixa de datas */
.dates{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;scroll-snap-align:center;width:58px;border:1px solid var(--linha);background:#fff;border-radius:16px;padding:7px 0 8px;text-align:center;cursor:pointer;position:relative}
.date small{display:block;font-size:11px;color:var(--mut)}
.date b{display:block;font:800 22px/1.1 var(--disp)}
.date::after{content:"";display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:var(--c,#ccc)}
.date.sel{background:var(--mar);border-color:var(--mar);color:#fff}
.date.sel small{color:#cfe3ea}
.date.today b{text-decoration:underline;text-decoration-color:var(--sol);text-decoration-thickness:3px;text-underline-offset:3px}
.dayhead h2{margin:4px 0 2px;font:800 26px/1.1 var(--disp);letter-spacing:-.02em}
.prog{height:6px;background:var(--linha);border-radius:9px;margin:10px 0 2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--restinga);border-radius:9px}

/* linha do tempo */
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:56px 26px 1fr auto;gap:0 8px;align-items:start;padding:0 0 4px}
.tl .t{font-size:12.5px;font-weight:600;color:var(--mut);padding:12px 0 0;text-align:right;border:0;background:none;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;line-height:1.3}
.tl .t.empty{color:#a9b8bc;font-weight:400}
.edit{display:grid;gap:8px;margin-top:8px}
.edit .row2 input[type=time]{max-width:140px}
.tl .rail{position:relative;height:100%;min-height:48px}
.tl .rail::before{content:"";position:absolute;left:12px;top:0;bottom:-4px;width:2px;background:var(--linha)}
.tl li:last-child .rail::before{bottom:auto;height:20px}
.tl .chk{position:relative;z-index:1;margin-top:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--mar);background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:14px;padding:0}
.tl .chk.ok{background:var(--restinga);border-color:var(--restinga)}
.tl .body{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 12px;margin:4px 0}
.tl .body.done .x{text-decoration:line-through;color:var(--mut)}
.tl .body.next{border:2px solid var(--sol)}
.tl .x{font-weight:600}
.tl .food{border-left:4px solid var(--sol)}
.tl .ia{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.del{border:0;background:none;color:var(--mut);font-size:20px;line-height:1;cursor:pointer;padding:12px 2px 0}
.add{display:flex;gap:8px;margin-top:10px}
.field{width:100%;padding:11px 12px;border:1px solid var(--linha);border-radius:12px;background:#fff;font-size:15px}
textarea.field{min-height:160px;resize:vertical}
label.lb{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--linha);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--fundo);color:#fff;border-color:var(--fundo)}

/* cartões de lugar e restaurante */
.card{background:#fff;border:1px solid var(--linha);border-radius:18px;padding:14px 16px;margin:0 0 12px}
.card h4{margin:0;font:800 18px/1.2 var(--disp);letter-spacing:-.01em}
.card .meta{font-size:13px;color:var(--mut);margin:2px 0 8px}
.card p{margin:0 0 8px}
.tip{background:var(--areia);border-radius:12px;padding:8px 12px;font-size:14px;margin:8px 0}
.hours{font-size:13.5px;margin:6px 0}
.when{display:inline-block;font-size:12.5px;font-weight:600;color:var(--restinga);margin-bottom:6px}
.when.no{color:var(--mut);font-weight:400}
.stars{display:inline-flex;gap:2px;margin-left:4px}
.stars button{border:0;background:none;font-size:22px;padding:0 1px;cursor:pointer;color:#c9d3d0}
.stars button.on{color:var(--sol)}

/* mais */
.menu a{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--linha);border-radius:16px;padding:14px 16px;margin:0 0 10px;text-decoration:none;color:var(--tinta)}
.menu i{font-style:normal;font-size:24px;width:30px;text-align:center}
.menu b{display:block;font:800 17px/1.2 var(--disp)}
.menu small{color:var(--mut)}
.back{border:0;background:none;color:var(--mar);font-weight:600;padding:12px 0 2px;cursor:pointer;font-size:15px}
.big{font:800 40px/1 var(--disp);letter-spacing:-.02em}
.bar{height:10px;border-radius:9px;background:var(--linha);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--mar)}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha)}
.list li:first-child{border-top:0}
.list input[type=checkbox]{width:22px;height:22px;accent-color:var(--restinga);flex:none}
.tel{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--linha);border-radius:16px;padding:12px 16px;margin:0 0 10px;text-decoration:none;color:var(--tinta)}
.tel b{font:800 26px/1 var(--disp);color:var(--mar)}

/* busca */
.overlay{position:fixed;inset:0;background:var(--espuma);z-index:20;overflow-y:auto;padding-bottom:30px}
.overlay .top input{flex:1;border:0;border-radius:12px;padding:10px 12px;font-size:16px;color:var(--tinta)}

/* navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--mut);cursor:pointer}
nav.tabs i{display:block;font-style:normal;font-size:21px;line-height:1.25}
nav.tabs button.on{color:var(--mar);font-weight:700}
nav.tabs button.on i{transform:translateY(-1px)}

    var f=false;
    day.items.forEach(function(it,j){if(it.p===pid&&!S.hidden['i:'+day.d+'-'+j])f=true});
    (S.extra[day.d]||[]).forEach(function(e){if(xp(e)===pid)f=true});
    if(f)r.push(i);
  });
  return r;
}
function whenTxt(pid){
  var ds=daysOf(pid);
  if(!ds.length)return '<span class="when no">Fora do roteiro</span>';
  return '<span class="when">No roteiro: '+ds.map(function(i){return 'dia '+(i+1)+' ('+fmt(DAYS[i].d)+')'}).join(', ')+'</span>';
}
function dayOptions(lbl){
  var o='<option value="">'+(lbl||'Colocar em um dia')+'</option>';
  DAYS.forEach(function(day,i){o+='<option value="'+day.d+'">Dia '+(i+1)+', '+fmt(day.d)+'</option>'});
  return o;
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1800)}
function tripPhase(){
  var td=todayStr();
  if(td<DAYS[0].d)return {ph:'antes',days:Math.ceil((dt(DAYS[0].d)-dt(td))/864e5)};
  if(td>DAYS[DAYS.length-1].d)return {ph:'depois'};
  return {ph:'durante',i:dayIdx(td)};
}
function lodgFor(d){for(var i=LODG.length-1;i>=0;i--){if(d>=LODG[i].from&&d<LODG[i].to)return LODG[i]}return LODG[LODG.length-1]}
var LBL={cedo:360,'manhã':540,manha:540,'almoço':750,almoco:750,tarde:900,volta:930,'fim de tarde':1020,jantar:1200,noite:1230};
function tmin(t){
  var m=/^~?(\d{1,2})[:h](\d{2})?/.exec(String(t||'').trim());
  if(m)return (+m[1])*60+(+(m[2]||0));
  var l=String(t||'').trim().toLowerCase();
  return LBL.hasOwnProperty(l)?LBL[l]:null;
}
function itemsOf(day){
  var out=[],last=0;
  day.items.forEach(function(it,j){
    var k=day.d+'-'+j;if(S.hidden['i:'+k])return;
    var t=S.times.hasOwnProperty(k)?S.times[k]:it.t;
    var mm=tmin(t);if(mm===null)mm=last;else if(!S.times.hasOwnProperty(k))last=mm;
    out.push({k:k,t:t,x:S.names[k]||it.x,p:it.p,extra:false,o:out.length,m:mm});
  });
  (S.extra[day.d]||[]).forEach(function(e,j){
    var k=day.d+'-x'+j,t=(e&&typeof e==='object'&&e.t)||'';var mm=tmin(t);
    out.push({k:k,t:t,x:xtext(e),p:xp(e),extra:true,j:j,o:1000+j,m:mm===null?1e6:mm});
  });
  out.sort(function(a,b){return a.m-b.m||a.o-b.o});
  return out;
}

  h+='<h3 class="sec">Seus itens</h3><div class="panel"><ul class="list">';
  S.malaExtra.forEach(function(it,ii){var k='x-'+ii;h+='<li><input type="checkbox" id="m'+k+'" data-mala="'+k+'"'+(S.mala[k]?' checked':'')+'><label for="m'+k+'" style="flex:1">'+esc(it)+'</label><button class="del" style="padding:0" data-delmala="'+ii+'" aria-label="Apagar">×</button></li>'});
  h+='</ul><div class="add"><input class="field" id="m-new" placeholder="Adicionar item"><button class="btn" data-addmala="1">Adicionar</button></div></div>';
  app.innerHTML=h+'</main>';
 },
 emerg:function(){
  var h=subhead('Emergência');
  [['190','Polícia Militar'],['192','SAMU'],['193','Bombeiros'],['191','Polícia Rodoviária Federal (BR-101 e BR-262)']].forEach(function(t){h+='<a class="tel" href="tel:'+t[0]+'"><span>'+esc(t[1])+'</span><b>'+t[0]+'</b></a>'});
  h+='<h3 class="sec">Hospedagens</h3>';
  LODG.forEach(function(l){h+='<div class="card"><h4>'+esc(l.name)+'</h4><div class="meta">'+esc(l.addr)+'</div><div class="small">Entrada '+esc(l.cin)+'<br>Saída '+esc(l.cout)+'</div><input class="field" style="margin-top:8px" data-hosp="'+l.key+'" placeholder="Telefone do anfitrião, código da porta" value="'+esc(S.hosp[l.key]||'')+'"><div class="acts"><a class="btn" target="_blank" rel="noopener" href="'+mapUrl(l.q)+'">📍 Mapa</a></div></div>'});
  h+='<h3 class="sec">Voos e carro</h3><div class="card"><div><b>Ida:</b> sai em 12/11 às 14:45, chega em 13/11 às 10:00</div><div><b>Volta:</b> 24/11 às 17:45</div><div style="margin-top:6px"><b>Carro:</b> Localiza, Av. Fernando Ferrari, Goiabeiras</div><div class="acts"><a class="btn ghost" target="_blank" rel="noopener" href="'+mapUrl(P.vix.q)+'">📍 Localiza</a></div></div>';
  app.innerHTML=h+'</main>';
 },
 dicas:function(){
  var h=subhead('Dicas'),nh=0;
  TIPS.forEach(function(g,gi){
    var lis='';
    g[1].forEach(function(t,ti){var k='t:'+gi+'-'+ti;if(S.hidden[k]){nh++;return}lis+='<li style="align-items:flex-start"><span style="flex:1">'+esc(t)+'</span><button class="del" style="padding:0" data-hide="'+k+'" aria-label="Esconder dica">×</button></li>'});
    if(lis)h+='<h3 class="sec">'+esc(g[0])+'</h3><div class="panel"><ul class="list">'+lis+'</ul></div>';
  });
  if(nh)h+='<p><button class="lnk" data-restoretips="1">Mostrar '+nh+' dica(s) escondida(s)</button></p>';
  app.innerHTML=h+'</main>';
 },
 notas:function(){
  app.innerHTML=subhead('Notas')+'<div class="panel"><textarea class="field" id="nt" placeholder="Escreva aqui">'+esc(S.notes||'')+'</textarea><p class="small muted">Salvo automaticamente neste celular.</p></div></main>';
 },
 backup:function(){
  app.innerHTML=subhead('Cópia de segurança')+'<div class="panel"><p style="margin-top:0">Seus itens marcados, notas, gastos e lugares ficam só neste celular. Se desinstalar o app, eles somem. Para guardar, copie o texto abaixo e cole numa conversa ou e-mail para você mesmo.</p><textarea class="field" id="bk" readonly>'+esc(JSON.stringify(S))+'</textarea><div class="acts"><button class="btn" data-copybk="1">Copiar</button></div></div>'
   +'<div class="panel"><b>Restaurar</b><p class="small muted">Cole aqui um texto copiado antes. Isso substitui os dados atuais.</p><textarea class="field" id="rs" style="min-height:90px"></textarea><div class="acts"><button class="btn ghost" data-restorebk="1">Restaurar dados</button></div></div></main>';
 }
};

/* ---- Busca ---- */
var ov=document.getElementById('ov');
function openSearch(){
  ov.innerHTML='<div class="overlay"><div class="top"><button class="iconbtn" data-closesearch="1" aria-label="Fechar">‹</button><input id="sq" placeholder="Buscar praia, restaurante, dia..." autocomplete="off"></div><main id="sres"></main></div>';
  var i=document.getElementById('sq');if(i&&i.focus)i.focus();doSearch();
}
function doSearch(){
  var box=document.getElementById('sres'),inp=document.getElementById('sq');if(!box||!inp)return;
  var raw=(inp.value||'').trim();
  if(raw.length<2){box.innerHTML='<p class="small muted" style="margin-top:14px">Digite pelo menos 2 letras. A busca olha o roteiro, os lugares, os restaurantes, as hospedagens e as dicas.</p>';return}
  var terms=norm(raw).split(/\s+/).filter(Boolean),dh='',ph='',fh='',lh='',th='',n=0;
  DAYS.forEach(function(day,i){itemsOf(day).forEach(function(it){var pl=it.p?P[it.p]:null;if(!hit(terms,it.x+' '+(pl?pl.name+' '+(pl.q||''):'')))return;n++;
    dh+='<div class="card"><div class="small muted">Dia '+(i+1)+', '+fmt(day.d)+(it.t?', '+esc(it.t):'')+'</div><b>'+esc(it.x)+'</b><div class="acts"><button class="btn ghost" data-openday="'+day.d+'">Abrir no roteiro</button>'+(pl?'<a class="btn ghost" target="_blank" rel="noopener" href="'+mapUrl(pl.q)+'">📍 Mapa</a>':'')+'</div></div>'})});
  allPlaces().forEach(function(p){if(!hit(terms,p.name+' '+p.type+' '+p.desc+' '+p.tip+' '+CITY[p.city].n+' '+(p.q||'')))return;n++;
    ph+='<div class="card"><h4>'+esc(p.name)+'</h4><div class="meta">'+esc(p.type)+', '+esc(CITY[p.city].n)+(S.hidden['p:'+p.id]?' (você tirou da lista)':'')+'</div>'+whenTxt(p.id)+'<div class="acts"><button class="btn ghost" data-go="'+p.id+'">Detalhes</button><a class="btn ghost" target="_blank" rel="noopener" href="'+mapUrl(p.q)+'">📍 Mapa</a></div></div>'});
  FOOD.forEach(function(f){if(!hit(terms,f.name+' '+f.area+' '+f.tags.join(' ')+' '+f.why+' '+CITY[f.city].n+' restaurante comer'))return;n++;
    fh+='<div class="card"><h4>'+esc(f.name)+'</h4><div class="meta">'+esc(f.area)+'</div>'+whenTxt(f.id)+'<div class="acts"><button class="btn ghost" data-go="'+f.id+'">Detalhes</button><a class="btn ghost" target="_blank" rel="noopener" href="'+mapUrl(f.q)+'">📍 Mapa</a></div></div>'});
  LODG.forEach(function(l){if(!hit(terms,'hospedagem '+l.name+' '+l.addr))return;n++;
    lh+='<div class="card"><h4>'+esc(l.name)+'</h4><div class="meta">'+esc(l.addr)+'</div><div class="small">Entrada '+esc(l.cin)+', saída '+esc(l.cout)+'</div><div class="acts"><a class="btn ghost" target="_blank" rel="noopener" href="'+mapUrl(l.q)+'">📍 Mapa</a></div></div>'});
  TIPS.forEach(function(g){g[1].forEach(function(t){if(!hit(terms,g[0]+' '+t))return;n++;th+='<div class="card"><div class="small muted">'+esc(g[0])+'</div>'+esc(t)+'</div>'})});
  var h='';
  if(dh)h+='<h3 class="sec">No roteiro</h3>'+dh;
  if(fh)h+='<h3 class="sec">Onde comer</h3>'+fh;
  if(ph)h+='<h3 class="sec">Lugares</h3>'+ph;
  if(lh)h+='<h3 class="sec">Hospedagens</h3>'+lh;
  if(th)h+='<h3 class="sec">Dicas</h3>'+th;
  if(!n)h='<div class="empty"><p><b>“'+esc(raw)+'” não está no app.</b><br>Não aparece no roteiro nem nas listas.</p><button class="btn" data-newplace="'+esc(raw)+'">＋ Adicionar “'+esc(raw)+'” como lugar</button></div>';
  else h+='<p class="small" style="margin-top:12px">Não achou o que queria? <button class="lnk" data-newplace="'+esc(raw)+'">Adicionar “'+esc(raw)+'” como lugar</button></p>';
  box.innerHTML=h;
}
function closeSearch(){ov.innerHTML=''}

/* =================== RENDER E EVENTOS =================== */
function render(){
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
  ({hoje:viewHoje,roteiro:viewRoteiro,comer:viewComer,lugares:viewLugares,mais:viewMais})[tab]();
}
function goTab(t){tab=t;if(t!=='mais')sub=null;render();window.scrollTo(0,0)}
function goPlace(id){
  closeSearch();
  var p=P[id];if(!p)return;
  if(p.food){foodCity='all';foodOnlyWant=false;goTab('comer')}else{placeCity='all';showForm=false;goTab('lugares')}
  var el=document.getElementById('pl-'+id);if(el&&el.scrollIntoView)el.scrollIntoView();
}
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;goTab(b.dataset.tab)});

function onClick(e){
  var t=e.target;
  function c(a){return t.closest('[data-'+a+']')}
  var x;
  if((x=c('search'))){openSearch();return}
  if((x=c('closesearch'))){closeSearch();return}
  if((x=c('go'))){e.preventDefault();goPlace(x.dataset.go);return}
  if((x=c('openday'))){closeSearch();selDay=x.dataset.openday;goTab('roteiro');return}
  if((x=c('day'))){selDay=x.dataset.day;editK=null;render();return}
  if((x=c('edit'))){editK=(editK===x.dataset.edit)?null:x.dataset.edit;render();var ei=document.getElementById('e-t');if(ei&&ei.focus)ei.focus();return}
  if((x=c('canceledit'))){editK=null;render();return}
  if((x=c('resetedit'))){delete S.times[x.dataset.resetedit];delete S.names[x.dataset.resetedit];editK=null;save();render();return}
  if((x=c('saveedit'))){saveEdit(x.dataset.saveedit);return}
  if((x=c('tabgo'))){goTab(x.dataset.tabgo);return}
  if((x=c('open'))){e.preventDefault();sub=x.dataset.open;goTab('mais');return}
  if((x=c('back'))){sub=null;render();window.scrollTo(0,0);return}
  if((x=c('k'))&&x.tagName==='BUTTON'){var k=x.dataset.k;if(S.done[k])delete S.done[k];else S.done[k]=1;save();render();return}
  if((x=c('newplace'))){closeSearch();formPre=x.dataset.newplace;showForm=true;placeCity='all';goTab('lugares');return}
  if((x=c('showform'))){formPre='';showForm=true;render();return}
  if((x=c('cancelform'))){showForm=false;formPre='';render();return}
  if((x=c('saveplace'))){savePlace();return}
  if((x=c('delcustom'))){delCustom(x.dataset.delcustom);return}
  if((x=c('fcity'))){foodCity=x.dataset.fcity;render();return}
  if((x=c('fonly'))){foodOnlyWant=!foodOnlyWant;render();return}
  if((x=c('pcity'))){placeCity=x.dataset.pcity;render();return}
  if((x=c('fwant'))){var f=S.food[x.dataset.fwant]=S.food[x.dataset.fwant]||{};f.want=!f.want;save();render();return}
  if((x=c('fbeen'))){var f2=S.food[x.dataset.fbeen]=S.food[x.dataset.fbeen]||{};f2.been=!f2.been;save();render();return}
  if((x=c('fstar'))){var sp=x.dataset.fstar.split('|');var f3=S.food[sp[0]]=S.food[sp[0]]||{};f3.stars=+sp[1];save();render();return}
  if((x=c('hide'))){S.hidden[x.dataset.hide]=1;save();render();toast('Tirado. Dá para trazer de volta.');return}
  if((x=c('unhide'))){delete S.hidden[x.dataset.unhide];save();render();return}
  if((x=c('restore'))){for(var q in S.hidden)if(q.indexOf('i:'+x.dataset.restore+'-')===0)delete S.hidden[q];save();render();return}
  if((x=c('restoretips'))){for(var q2 in S.hidden)if(q2.indexOf('t:')===0)delete S.hidden[q2];save();render();return}
  if((x=c('addbtn'))){addItem(x.dataset.addbtn);return}
  if((x=c('del'))){var p=x.dataset.del.split('|');S.extra[p[0]].splice(+p[1],1);for(var kk in S.done)if(kk.indexOf(p[0]+'-x')===0)delete S.done[kk];save();render();return}
  if((x=c('addgasto'))){addGasto();return}
  if((x=c('delgasto'))){S.gastos.splice(+x.dataset.delgasto,1);save();render();return}
  if((x=c('addmala'))){var v=(document.getElementById('m-new').value||'').trim();if(v){S.malaExtra.push(v);save();render()}return}
  if((x=c('delmala'))){var ii=+x.dataset.delmala;S.malaExtra.splice(ii,1);var nm={};for(var mk in S.mala){if(mk.indexOf('x-')!==0)nm[mk]=S.mala[mk];else{var n0=+mk.slice(2);if(n0<ii)nm[mk]=1;else if(n0>ii)nm['x-'+(n0-1)]=1}}S.mala=nm;save();render();return}
  if((x=c('copybk'))){var ta=document.getElementById('bk');try{navigator.clipboard.writeText(ta.value).then(function(){toast('Copiado')},function(){ta.select();toast('Selecione e copie')})}catch(er){ta.select&&ta.select();toast('Selecione e copie')}return}
  if((x=c('restorebk'))){try{var o=JSON.parse(document.getElementById('rs').value);if(!o||typeof o!=='object')throw 0;for(var kk2 in o)S[kk2]=o[kk2];save();load();buildP();toast('Dados restaurados');sub=null;render()}catch(er){toast('Texto inválido. Cole a cópia inteira.')}return}
}
app.addEventListener('click',onClick);ov.addEventListener('click',onClick);

function onChange(e){
  var el=e.target,ds=el.dataset||{};
  if(ds.pend!==undefined){if(el.checked)S.pend[ds.pend]=1;else delete S.pend[ds.pend];save();render();return}
  if(ds.mala!==undefined){if(el.checked)S.mala[ds.mala]=1;else delete S.mala[ds.mala];save();return}
  if(ds.putsel&&el.value){var pid=ds.putsel,d=el.value;(S.extra[d]=S.extra[d]||[]).push({x:P[pid].name,p:pid});save();toast('Adicionado ao dia '+(dayIdx(d)+1));render();return}
}
app.addEventListener('change',onChange);
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.add){e.preventDefault();addItem(e.target.dataset.add)}});
function onInput(e){
  var el=e.target;
  if(el.id==='sq'){doSearch();return}
  if(el.id==='nt'){S.notes=el.value;save();return}
  if(el.dataset&&el.dataset.hosp){S.hosp[el.dataset.hosp]=el.value;save()}
}
app.addEventListener('input',onInput);ov.addEventListener('input',onInput);

function addItem(d){var inp=app.querySelector('[data-add="'+d+'"]');var v=inp&&inp.value.trim();if(!v){toast('Escreva o que vai fazer');return}
  var te=document.getElementById('add-t'),t=te&&te.value||'';
  (S.extra[d]=S.extra[d]||[]).push(t?{x:v,t:t}:v);save();render();toast(t?'Adicionado às '+t:'Adicionado')}
function saveEdit(k){
  var t=(document.getElementById('e-t').value||'').trim()||(document.getElementById('e-tl').value||'').trim();
  var nm=(document.getElementById('e-x').value||'').trim();
  var m=/^(\d{4}-\d{2}-\d{2})-x(\d+)$/.exec(k);
  if(m){var arr=S.extra[m[1]],e=arr[+m[2]];var o=(typeof e==='object')?e:{x:e};if(nm)o.x=nm;if(t)o.t=t;else delete o.t;arr[+m[2]]=(o.p||o.t)?o:o.x}
  else{S.times[k]=t;if(nm)S.names[k]=nm}
  editK=null;save();render();toast('Salvo');
}
function addGasto(){
  var v=parseFloat(String(document.getElementById('g-v').value||'').replace(/\./g,'').replace(',','.'));
  if(!(v>0)){toast('Digite um valor, por exemplo 45,90');return}
  S.gastos.push({v:v,c:document.getElementById('g-c').value,desc:(document.getElementById('g-d').value||'').trim(),day:document.getElementById('g-day').value});
  save();render();toast('Gasto adicionado');
}
function savePlace(){
  var nm=(document.getElementById('np-name').value||'').trim();if(!nm){toast('Dê um nome ao lugar');return}
  var city=document.getElementById('np-city').value,q=(document.getElementById('np-q').value||'').trim(),note=(document.getElementById('np-note').value||'').trim(),day=document.getElementById('np-day').value;
  var id='c'+Date.now();
  S.custom.push({id:id,custom:true,city:city,name:nm,type:'Adicionado por você',q:q||(nm+' '+CITY[city].w+' ES'),desc:note,tip:''});buildP();
  if(day)(S.extra[day]=S.extra[day]||[]).push({x:nm,p:id});
  save();showForm=false;formPre='';placeCity='all';render();toast('Lugar salvo');
  var el=document.getElementById('pl-'+id);if(el&&el.scrollIntoView)el.scrollIntoView();
}
function delCustom(id){
  S.custom=S.custom.filter(function(p){return p.id!==id});
  for(var d in S.extra){var b=S.extra[d].length;S.extra[d]=S.extra[d].filter(function(e){return xp(e)!==id});if(S.extra[d].length!==b)for(var k in S.done)if(k.indexOf(d+'-x')===0)delete S.done[k]}
  buildP();save();render();
}
render();
</script>
